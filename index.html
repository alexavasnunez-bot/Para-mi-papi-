<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Un año contigo ❤️</title>
<style>
  :root {
    --butter:#FFF0A8;
    --butter2:#FFE78A;
    --cream:#FFF9D8;
    --brown:#5A3517;
    --pink:#F58FA6;
    --white:#fffdf1;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    background:
      radial-gradient(circle at 10% 15%, rgba(255,255,255,.45) 0 35px, transparent 36px),
      radial-gradient(circle at 90% 25%, rgba(255,255,255,.35) 0 45px, transparent 46px),
      linear-gradient(135deg,var(--butter),#fff3b5 55%,var(--butter2));
    color:var(--brown);
    font-family: "Trebuchet MS", system-ui, sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  nav{
    position:sticky;top:0;z-index:20;
    display:flex;justify-content:center;gap:28px;flex-wrap:wrap;
    padding:16px 12px;
    background:rgba(255,248,190,.86);
    backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(90,53,23,.16);
  }
  nav a{color:var(--brown);text-decoration:none;font-weight:700;font-size:15px}
  nav a:hover{opacity:.65}
  .hero{text-align:center;padding:64px 18px 30px;position:relative}
  .sparkle{position:absolute;font-size:25px;animation:float 3s ease-in-out infinite}
  .s1{left:9%;top:65px} .s2{right:11%;top:120px;animation-delay:.7s}
  .s3{left:15%;bottom:20px;animation-delay:1.2s} .s4{right:16%;bottom:25px;animation-delay:1.8s}
  h1{
    margin:0 auto 12px;
    max-width:850px;
    font-size:clamp(38px,7vw,76px);
    line-height:1.02;
    letter-spacing:-2px;
    font-weight:800;
  }
  .subtitle{font-size:18px;opacity:.8;margin:0}
  .heart{display:inline-block;animation:beat 1.4s ease-in-out infinite}
  .gallery{
    width:min(1100px,92%);
    margin:30px auto 60px;
    display:grid;grid-template-columns:repeat(3,1fr);gap:24px;
  }
  .photo{
    background:var(--white);
    padding:12px 12px 22px;
    border-radius:4px;
    box-shadow:0 14px 30px rgba(75,45,20,.18);
    transform:rotate(-2deg);
    transition:.35s;
    animation:rise .8s ease both;
  }
  .photo:nth-child(2){transform:rotate(2deg);animation-delay:.12s}
  .photo:nth-child(3){transform:rotate(-1deg);animation-delay:.24s}
  .photo:hover{transform:translateY(-8px) rotate(0deg) scale(1.02)}
  .photo img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:2px}
  .caption{text-align:center;font-weight:700;margin-top:12px;font-size:15px}
  .sections{width:min(1050px,92%);margin:auto;display:grid;gap:24px}
  .card{
    background:rgba(255,251,220,.75);
    border:1px solid rgba(90,53,23,.12);
    border-radius:24px;
    padding:28px;
    box-shadow:0 12px 30px rgba(75,45,20,.08);
  }
  .two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  h2{margin:0 0 12px;font-size:28px}
  p{font-size:17px;line-height:1.65;margin:8px 0}
  .music{
    display:flex;align-items:center;gap:18px;
    background:#fff8cf;border-radius:18px;padding:15px;
  }
  .music-icon{width:62px;height:62px;border-radius:16px;background:var(--pink);display:grid;place-items:center;font-size:30px}
  .play{
    border:0;background:var(--brown);color:white;border-radius:999px;
    padding:10px 18px;cursor:pointer;font-weight:700
  }
  .envelope-area{text-align:center;padding:38px 20px}
  .envelope{
    border:0;background:transparent;cursor:pointer;font-size:74px;
    transition:.25s;filter:drop-shadow(0 8px 10px rgba(75,45,20,.15))
  }
  .envelope:hover{transform:translateY(-7px) scale(1.05)}
  .hidden-message{max-height:0;overflow:hidden;opacity:0;transition:max-height 1s ease,opacity .8s ease}
  .hidden-message.open{max-height:300px;opacity:1}
  .type{font-size:25px;font-weight:800;line-height:1.35;margin:20px auto 0;max-width:720px}
  footer{text-align:center;padding:55px 20px 45px;font-size:16px}
  @keyframes beat{50%{transform:scale(1.18)}}
  @keyframes float{50%{transform:translateY(-9px) rotate(5deg)}}
  @keyframes rise{from{opacity:0;transform:translateY(25px) rotate(-2deg)}to{opacity:1}}
  @media(max-width:760px){
    .gallery,.two{grid-template-columns:1fr}
    .gallery{gap:28px}
    .photo:nth-child(2),.photo:nth-child(3){transform:rotate(0)}
    nav{gap:15px}
    .hero{padding-top:45px}
  }

  /* Solo para las dos fotos nuevas: efecto abanico superpuesto */
  .fan-photos{
    width:min(760px,92%);
    height:560px;
    margin:10px auto 70px;
    position:relative;
  }
  .fan-photo{
    position:absolute;
    width:min(390px,62%);
    background:var(--white);
    padding:12px 12px 22px;
    border-radius:4px;
    box-shadow:0 14px 30px rgba(75,45,20,.18);
    transition:.35s;
    animation:rise .8s ease both;
  }
  .fan-photo img{
    display:block;
    width:100%;
    aspect-ratio:3/4;
    object-fit:cover;
    border-radius:2px;
  }
  .fan-photo.bottom{
    left:8%;
    top:55px;
    transform:rotate(5deg);
    z-index:1;
  }
  .fan-photo.top{
    right:8%;
    top:0;
    transform:rotate(-6deg);
    z-index:2;
    animation-delay:.12s;
  }
  .fan-photo:hover{
    transform:translateY(-8px) rotate(0deg) scale(1.02);
    z-index:3;
  }
  @media(max-width:760px){
    .fan-photos{
      width:94%;
      height:475px;
    }
    .fan-photo{
      width:64%;
    }
    .fan-photo.bottom{
      left:1%;
      top:48px;
    }
    .fan-photo.top{
      right:1%;
      top:0;
    }
  }

</style>
</head>

</nav>
